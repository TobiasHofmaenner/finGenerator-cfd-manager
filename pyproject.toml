[project]
name = "cfdmanager"
version = "0.3.0"
description = "T-FINS CFD job manager: a slim FastAPI dispatcher (queue in CNPG) that hands CFD jobs to off-cluster workers and forwards results to findata."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tobias Hofmänner" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
